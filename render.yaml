services:
  - type: web
    name: smart-budget-allocator-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./smart_budget.db
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_SHEETS_ENABLED
        value: "false"
